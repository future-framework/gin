# AWS experiment: one spot machine per job, no fan-out. gin-gonic/gin's .github/workflows/gin.yml: test (os: ubuntu-latest, go: 1.27, test-tags: ""), for the Superaction scoreboard.
name: Superaction (AWS)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: test / superaction-aws
    runs-on: superaction-aws
    timeout-minutes: 30
    env:
      GO111MODULE: on
      TESTTAGS: ""
      GOPROXY: https://proxy.golang.org
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run Tests
        run: make test
